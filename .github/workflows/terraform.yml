name: terraform

on:
  # Every PR runs, so the required checks never wait on a skipped run
  pull_request:
  push:
    branches: [main]
    paths: ["infra/**", "simulator/**", ".github/workflows/**"]
  schedule:
    - cron: "0 5 * * *" # nightly drift check
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for Azure login
  contents: read
  pull-requests: write # post the plan as a PR comment
  packages: write # push the simulator image to GitHub Container Registry

# Applies on main queue up and never overlap; each PR gets its own lane
concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  # Container image for the station simulator. Tagged by a hash of its source,
  # so the image (and the running job) only changes when the simulator does.
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          tag=$(echo "${{ hashFiles('simulator/**') }}" | cut -c1-12)
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chargenet-simulator:$tag" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: python -m py_compile simulator/simulator.py

      - name: Check if image exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && steps.exists.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # PRs build to prove the image works; only main pushes it
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.exists == 'false'
        with:
          context: simulator
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # Shared foundations first: policy, budget, hub network
  platform:
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: platform
      working_directory: infra/platform

  # Then environments that build on the platform. On the nightly drift check,
  # dev still runs even if platform reported drift.
  dev:
    needs: [platform, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.platform.result == 'success' || github.event_name == 'schedule') }}
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      working_directory: infra/envs/dev
      simulator_image: ${{ needs.build.outputs.image }}
