name: terraform

on:
  # Every PR runs, so the required checks never wait on a skipped run
  pull_request:
  push:
    branches: [main]
    paths: ["infra/**", "simulator/**", "processor/**", ".github/workflows/**"]
  schedule:
    - cron: "0 5 * * *" # nightly drift check
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for Azure login
  contents: read
  pull-requests: write # post the plan as a PR comment
  packages: write # push container images to GitHub Container Registry

# Applies on main queue up and never overlap; each PR gets its own lane
concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  # Container images for the apps. Each is tagged by a hash of its own source,
  # so an image (and the job running it) only changes when that app does.
  build:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.build.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # PRs build to prove the images work; only main pushes them
      - name: Build
        id: build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          map=""
          for app in simulator processor; do
            # Syntax check that writes no .pyc files, which would change the hash below
            python -c 'import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]' "$app"/*.py
            tag=$(find "$app" -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)
            image="ghcr.io/$owner/chargenet-$app:$tag"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "$image already exists"
            else
              docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" "$app"
              if [ "$GITHUB_REF" = "refs/heads/main" ]; then docker push "$image"; fi
            fi
            map="$map$app = \"$image\", "
          done
          echo "images={ ${map%, } }" >> "$GITHUB_OUTPUT"

  # Shared foundations first: policy, budget, hub network
  platform:
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: platform
      working_directory: infra/platform

  # Then environments that build on the platform. On the nightly drift check,
  # dev still runs even if platform reported drift.
  dev:
    needs: [platform, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.platform.result == 'success' || github.event_name == 'schedule') }}
    uses: ./.github/workflows/_terraform.yml
    with:
      environment: dev
      working_directory: infra/envs/dev
      images: ${{ needs.build.outputs.images }}
